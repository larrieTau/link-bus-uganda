      function normalizeUgPhone(raw) {
        const digits = raw.replace(/\D/g, "");
        if (!digits) return "";
        if (digits.startsWith("256") && digits.length === 12) return digits;
        if (digits.startsWith("0") && digits.length === 10) return `256${digits.slice(1)}`;
        if (digits.length === 9) return `256${digits}`;
        return digits;
      }

      function isValidUgPhone(raw) {
        const normalized = normalizeUgPhone(raw);
        return /^2567\d{8}$/.test(normalized);

      // GPS Tracking Functions
      function calculateDistance(lat1, lng1, lat2, lng2) {
        // Haversine formula for distance between two coordinates in km
        const R = 6371;
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLng = ((lng2 - lng1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function calculateETA(currentLat, currentLng, destLat, destLng, speedKmh) {
        const distKm = calculateDistance(currentLat, currentLng, destLat, destLng);
        if (speedKmh === 0) return "Stationary";
        const timeHours = distKm / speedKmh;
        const hours = Math.floor(timeHours);
        const minutes = Math.round((timeHours - hours) * 60);
        return `${hours}h ${minutes}m`;
      }

      function simulateBusMovement(busId) {
        // Simulate bus GPS update by moving toward next waypoint
        const bus = busLocations[busId];
        if (!bus) return;
        
        const nextLat = bus.lat + Math.random() * 0.05 - 0.025;
        const nextLng = bus.lng + Math.random() * 0.05 - 0.025;
        const newProgress = Math.min(bus.progress + 2, 100);
        
        setBusLocations((prev) => ({
          ...prev,
          [busId]: {
            ...bus,
            lat: nextLat,
            lng: nextLng,
            speed: Math.floor(Math.random() * 40) + 70,
            progress: newProgress,
            eta: calculateETA(nextLat, nextLng, 1.6761, 31.4865, 85)
          }
        }));
      }

            selectedAmenities.length === 0 ||
            selectedAmenities.every((amenity) => schedule.amenities.includes(amenity));

          return timeMatch && priceMatch && amenityMatch;
        });

                  <div>
                    <h3 className="font-display text-xl font-bold text-green-dark mb-3">Select Bus</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {Object.entries(busLocations).map(([busId, data]) => (
                        <button
                          key={busId}
                          onClick={() => setSelectedBusForTracking(busId)}
                          className={`p-4 rounded-lg border-2 transition ${
                            selectedBusForTracking === busId
                              ? "border-green bg-green-light"
                              : "border-gray-200 hover:border-green bg-gray-50"
                          }`}
                        >
                          <div className="font-display font-bold text-lg">{busId}</div>
                          <div className="text-xs text-gray-600 mt-2">{data.name}</div>
                          <div className="text-yellow-600 font-bold text-sm mt-2">{data.speed} km/h</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Real-time Location Data */}
                  {busLocations[selectedBusForTracking] && (
                    <div className="space-y-6">
                      {/* Map Visualization */}
                      <div className="border-2 border-gray-200 rounded-xl p-6 bg-gradient-to-br from-blue-50 to-blue-100">
                        <h4 className="font-display font-bold text-green-dark mb-4">Route Map (Simplified)</h4>
                        
                        {/* Route Progress Visualization */}
                        <div className="space-y-4">
                          <div>
                            <div className="flex justify-between mb-2">
                              <span className="font-semibold">Route Progress</span>
                              <span className="font-bold text-green">{busLocations[selectedBusForTracking].progress}%</span>
                            </div>
                            <div className="w-full h-3 rounded-full bg-gray-300 overflow-hidden">
                              <div
                                className="h-full bg-green transition-all duration-300"
                                style={{ width: `${busLocations[selectedBusForTracking].progress}%` }}
                              ></div>
                            </div>
                          </div>

                          {/* Waypoints */}
                          <div className="mt-6">
                            <div className="text-sm font-semibold text-gray-700 mb-3">Waypoints</div>
                            <div className="flex justify-between items-center gap-1">
                              {routeCoordinates.map((point, idx) => (
                                <div key={idx} className="flex flex-col items-center">
                                  <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white mb-1 ${
                                    idx <= routeCoordinates.length * (busLocations[selectedBusForTracking].progress / 100)
                                      ? "bg-green"
                                      : "bg-gray-400"
                                  }`}>
                                    {idx + 1}
                                  </div>
                                  <div className="text-[0.7rem] text-gray-600 text-center max-w-[60px]">{point.name}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* GPS & Location Details */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {/* Current Location */}
                        <div className="border-2 border-gray-200 rounded-lg p-4 bg-gray-50">
                          <div className="text-xs font-bold text-gray-600 uppercase">Current Location</div>
                          <div className="mt-3 font-mono text-sm font-bold text-green-dark">
                            <div>Lat: {busLocations[selectedBusForTracking].lat.toFixed(4)}</div>
                            <div>Lng: {busLocations[selectedBusForTracking].lng.toFixed(4)}</div>
                          </div>
                        </div>

                        {/* Speed */}
                        <div className="border-2 border-gray-200 rounded-lg p-4 bg-gray-50">
                          <div className="text-xs font-bold text-gray-600 uppercase">Current Speed</div>
                          <div className="mt-3">
                            <div className="text-3xl font-black text-yellow">{busLocations[selectedBusForTracking].speed}</div>
                            <div className="text-xs text-gray-600">km/h</div>
                          </div>
                        </div>

                        {/* ETA */}
                        <div className="border-2 border-gray-200 rounded-lg p-4 bg-gray-50">
                          <div className="text-xs font-bold text-gray-600 uppercase">ETA to Destination</div>
                          <div className="mt-3">
                            <div className="text-2xl font-black text-green">{busLocations[selectedBusForTracking].eta}</div>
                            <div className="text-xs text-gray-600">Fort Portal</div>
                          </div>
                        </div>

                        {/* Distance Remaining */}
                        <div className="border-2 border-gray-200 rounded-lg p-4 bg-gray-50">
                          <div className="text-xs font-bold text-gray-600 uppercase">Distance Remaining</div>
                          <div className="mt-3">
                            <div className="text-3xl font-black text-blue-600">{Math.round(310 * (1 - busLocations[selectedBusForTracking].progress / 100))}</div>
                            <div className="text-xs text-gray-600">km</div>
                          </div>
                        </div>
                      </div>

                      {/* Additional Info */}
                      <div className="border-2 border-gray-200 rounded-lg p-4 bg-gradient-to-br from-yellow-50 to-yellow-100">
                        <h4 className="font-display font-bold text-green-dark mb-3">📡 Live Status</h4>
                        <div className="grid grid-cols-2 gap-4 text-sm">
                          <div>
                            <span className="font-semibold">Route:</span>
                            <span className="ml-2">Kampala → Fort Portal</span>
                          </div>
                          <div>
                            <span className="font-semibold">Total Distance:</span>
                            <span className="ml-2">310 km</span>
                          </div>
                          <div>
                            <span className="font-semibold">Distance Covered:</span>
                            <span className="ml-2">{Math.round(310 * (busLocations[selectedBusForTracking].progress / 100))} km</span>
                          </div>
                          <div>
                            <span className="font-semibold">Status:</span>
                            <span className="ml-2 text-green font-bold">🟢 In Transit</span>
                          </div>
                        </div>
                      </div>

                      {/* Notes */}
                      <div className="border-l-4 border-blue-500 bg-blue-50 p-4 rounded">
                        <p className="text-sm text-gray-700">
                          <strong>Real-time Updates:</strong> GPS coordinates and ETA are simulated for demonstration. In production, these will be fetched from actual bus GPS trackers via backend API every 5 seconds.
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Advanced Search Modal */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-4">
              <div className="w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-[20px] bg-white shadow-2xl">
                {/* Search Header */}
                <div className="sticky top-0 flex items-center justify-between border-b border-gray-200 bg-gradient-to-r from-blue-600 to-blue-700 px-8 py-6 text-white">
                  <h2 className="font-display text-3xl font-bold">🔍 Advanced Search</h2>
                  <button
                    onClick={() => setIsSearchOpen(false)}
                    className="text-2xl font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="px-8 py-6 space-y-6">
                  {/* Time Filter */}
                  <div className="border-2 border-gray-200 rounded-lg p-6 bg-gray-50">
                    <h3 className="font-display font-bold text-lg text-green-dark mb-4">⏰ Departure Time</h3>
                    <div className="grid grid-cols-2 gap-6">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">From</label>
                        <input
                          type="time"
                          value={searchFilters.minTime}
                          onChange={(e) =>
                            setSearchFilters({ ...searchFilters, minTime: e.target.value })
                          }
                          className="w-full rounded-lg border-2 border-gray-300 px-4 py-3 outline-none transition focus:border-blue-600"
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">To</label>
                        <input
                          type="time"
                          value={searchFilters.maxTime}
                          onChange={(e) =>
                            setSearchFilters({ ...searchFilters, maxTime: e.target.value })
                          }
                          className="w-full rounded-lg border-2 border-gray-300 px-4 py-3 outline-none transition focus:border-blue-600"
                        />
                      </div>
                    </div>
                    <p className="mt-3 text-xs text-gray-600">
                      Selected time range: <span className="font-bold">{searchFilters.minTime}</span> to <span className="font-bold">{searchFilters.maxTime}</span>
                    </p>
                  </div>

                  {/* Price Filter */}
                  <div className="border-2 border-gray-200 rounded-lg p-6 bg-gray-50">
                    <h3 className="font-display font-bold text-lg text-green-dark mb-4">💰 Price Range (UGX)</h3>
                    <div className="space-y-4">
                      <div>
                        <div className="flex justify-between mb-2">
                          <label className="text-sm font-semibold text-gray-700">Min Price</label>
                          <span className="font-bold text-green-dark">{searchFilters.minPrice.toLocaleString()}</span>
                        </div>
                        <input
                          type="range"
                          min="20000"
                          max="60000"
                          step="5000"
                          value={searchFilters.minPrice}
                          onChange={(e) =>
                            setSearchFilters({ ...searchFilters, minPrice: parseInt(e.target.value) })
                          }
                          className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-green"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between mb-2">
                          <label className="text-sm font-semibold text-gray-700">Max Price</label>
                          <span className="font-bold text-green-dark">{searchFilters.maxPrice.toLocaleString()}</span>
                        </div>
                        <input
                          type="range"
                          min="30000"
                          max="70000"
                          step="5000"
                          value={searchFilters.maxPrice}
                          onChange={(e) =>
                            setSearchFilters({ ...searchFilters, maxPrice: parseInt(e.target.value) })
                          }
                          className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-green"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Amenities Filter */}
                  <div className="border-2 border-gray-200 rounded-lg p-6 bg-gray-50">
                    <h3 className="font-display font-bold text-lg text-green-dark mb-4">✨ Amenities</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                      {[
                        { key: "ac", label: "❄️ Air Conditioning", emoji: "AC" },
                        { key: "wifi", label: "📶 WiFi", emoji: "WiFi" },
                        { key: "usb", label: "🔌 USB Charging", emoji: "USB" },
                        { key: "recline", label: "🛏️ Reclining Seats", emoji: "Recline" },
                        { key: "toilet", label: "🚽 Onboard Toilet", emoji: "WC" },
                        { key: "blanket", label: "🛌 Blankets", emoji: "Blanket" }
                      ].map((amenity) => (
                        <label
                          key={amenity.key}
                          className="flex items-center gap-3 p-3 rounded-lg border-2 border-gray-300 hover:border-green cursor-pointer transition"
                        >
                          <input
                            type="checkbox"
                            checked={searchFilters.amenities[amenity.key]}
                            onChange={(e) =>
                              setSearchFilters({
                                ...searchFilters,
                                amenities: {
                                  ...searchFilters.amenities,
                                  [amenity.key]: e.target.checked
                                }
                              })
                            }
                            className="w-4 h-4 rounded accent-green cursor-pointer"
                          />
                          <div>
                            <div className="font-semibold text-sm text-gray-700">{amenity.label}</div>
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Search Results */}
                  <div className="border-2 border-gray-200 rounded-lg p-6 bg-gray-50">
                    <h3 className="font-display font-bold text-lg text-green-dark mb-4">
                      📋 Results ({filterSchedules().length})
                    </h3>
                    {filterSchedules().length === 0 ? (
                      <p className="text-center text-gray-600 py-6">No buses match your filters. Try adjusting your search.</p>
                    ) : (
                      <div className="space-y-3">
                        {filterSchedules().map((schedule) => (
                          <div
                            key={schedule.id}
                            className="border border-gray-200 rounded-lg p-4 hover:bg-white transition border-l-4 border-l-green"
                          >
                            <div className="flex items-start justify-between">
                              <div>
                                <div className="font-bold text-lg">{schedule.time}</div>
                                <div className="text-sm text-gray-600 mt-1">Bus: {schedule.bus}</div>
                                <div className="flex gap-2 flex-wrap mt-2">
                                  {schedule.amenities.map((amenity) => {
                                    const amenityNames = {
                                      ac: "❄️ AC",
                                      wifi: "📶 WiFi",
                                      usb: "🔌 USB",
                                      recline: "🛏️ Recline",
                                      toilet: "🚽 WC",
                                      blanket: "🛌 Blanket"
                                    };
                                    return (
                                      <span
                                        key={amenity}
                                        className="inline-block text-xs bg-green-light text-green px-2 py-1 rounded"
                                      >
                                        {amenityNames[amenity]}
                                      </span>
                                    );
                                  })}
                                </div>
                              </div>
                              <div className="text-right">
                                <div className="font-display text-2xl font-black text-green">
                                  {schedule.price.toLocaleString()}
                                </div>
                                <div className="text-xs text-gray-600">UGX</div>
                                <button className="mt-3 bg-green px-4 py-2 text-sm font-bold text-white rounded transition hover:bg-green-dark">
                                  Select
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Action Buttons */}
                  <div className="flex gap-3">
                    <button
                      onClick={resetFilters}
                      className="flex-1 rounded-lg bg-gray-300 px-6 py-3 font-bold text-gray-700 transition hover:bg-gray-400"
                    >
                      🔄 Reset Filters
                    </button>
                    <button
                      onClick={() => {
                        searchBuses();
                        setIsSearchOpen(false);
                      }}
                      className="flex-1 rounded-lg bg-green px-6 py-3 font-bold text-white transition hover:bg-green-dark"
                    >
                      ✓ Apply Search
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <a
            ref={whatsappRef}
            href="https://wa.me/256700000000?text=Hello%20Link%20Bus%2C%20I%20need%20help%20with%20my%20booking."
            title="Chat on WhatsApp"
            target="_blank"
            rel="noopener"
            className="fixed bottom-7 right-6 z-[60] flex h-[60px] w-[60px] items-center justify-center rounded-full bg-[#25d366] text-3xl no-underline shadow-[0_4px_20px_rgba(37,211,102,0.4)] transition hover:scale-110"
          >
            💬
          </a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
